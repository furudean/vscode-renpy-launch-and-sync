"on":
  push: {}

name: Test
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        sdk:
          - 8.1.0
          - 8.3.7
          - 8.5.3
    runs-on: "${{ matrix.os }}"
    env:
      RENPY_SDK_VERSION: "${{ matrix.sdk }}"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"

      - name: Cache .vscode-test/
        id: cache-vscode-test
        uses: actions/cache@v5
        with:
          path: |
            .vscode-test
            ${{ runner.temp }}/renpy-warp-user-data
          key: ${{ runner.os }}-vscode-test-${{ matrix.sdk }}-${{ hashFiles('.vscode-test.mjs', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-vscode-test-${{ matrix.sdk }}-

      - run: npm ci

      - run: npm run lint

      - run: xvfb-run -a npm test
        if: runner.os == 'Linux'

      - run: npm test
        if: runner.os != 'Linux'
