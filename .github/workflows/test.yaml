"on":
  push: {}

name: Test
jobs:
  test:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: "${{ matrix.os }}"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"

      - name: Cache .vscode-test/
        id: cache-vscode-test
        uses: actions/cache@v5
        with:
          path: .vscode-test
          key: ${{ runner.os }}-vscode-test

      - run: npm ci

      - run: xvfb-run -a npm test
        if: runner.os == 'Linux'

      - run: npm test
        if: runner.os != 'Linux'
