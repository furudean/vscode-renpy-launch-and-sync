"on":
  push: {}

name: Test
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        sdk:
          - 8.1.0
          - 8.3.7
          - 8.5.3
    runs-on: "${{ matrix.os }}"
    env:
      RENPY_SDK_VERSION: "${{ matrix.sdk }}"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node.js
        id: setup-node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: ${{ runner.os }}-${{ runner.arch }}-node-${{ steps.setup-node.outputs.node-version }}-modules-${{ hashFiles('package-lock.json') }}

      - name: Resolve VS Code version
        id: vscode-version
        shell: bash
        run: |
          version=$(node -e "fetch('https://update.code.visualstudio.com/api/releases/stable').then((r) => r.json()).then(([v]) => console.log(v))")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "VSCODE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Cache VS Code
        uses: actions/cache@v6
        with:
          path: .vscode-test/vscode-*
          key: ${{ runner.os }}-${{ runner.arch }}-vscode-${{ steps.vscode-version.outputs.version }}

      - name: Cache Ren'Py SDK
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/renpy-warp-user-data/User/globalStorage/paisleysoftworks.renpywarp/sdks
          key: ${{ runner.os }}-renpy-sdk-${{ matrix.sdk }}

      - run: npm ci
        if: steps.cache-node-modules.outputs.cache-hit != 'true'

      - run: npm run lint

      - run: xvfb-run -a npm test
        if: runner.os == 'Linux'

      - run: npm test
        if: runner.os != 'Linux'
