"on":
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch: {}

name: Release

env:
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  meta:
    name: Read extension metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.info.outputs.version }}
      tag: ${{ steps.info.outputs.tag }}
      stable: ${{ steps.info.outputs.stable }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read version from package.json
        id: info
        env:
          # empty when the workflow is dispatched off a branch instead of a tag
          TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          VERSION=$(jq -r '.version' package.json)

          if [ -z "$TAG" ] && [ "$DRY_RUN" != "true" ]; then
            echo "::error::releases must run from a tag"
            exit 1
          fi

          if [ -n "$TAG" ] && [ "$TAG" != "v$VERSION" ]; then
            echo "::error::tag $TAG does not match package.json version $VERSION"
            exit 1
          fi

          # a tag with a suffix, v1.2.3-rc1, is a pre-release
          case "$TAG" in
            *-*) stable=false ;;
            *) stable=true ;;
          esac

          {
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "stable=$stable"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build and publish
    needs: meta
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      VSIX: renpy-warp-v${{ needs.meta.outputs.version }}.vsix
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"

      - run: npm ci

      - name: Create extension package
        run: npm run package -- --out "$VSIX"

      - name: Upload artifact to workflow
        uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: ${{ env.VSIX }}
          if-no-files-found: error

      - name: Release to Visual Studio Code Marketplace
        if: env.DRY_RUN != 'true'
        run: npm run publish:vsce -- --packagePath "$VSIX" --oidc --skip-duplicate

      - name: Release to Open VSX Registry
        if: env.DRY_RUN != 'true'
        run: npm run publish:ovsx -- --packagePath "$VSIX" --trusted-publishing --skip-duplicate

  release:
    name: Publish the release
    needs: [meta, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.meta.outputs.tag }}
      VERSION: ${{ needs.meta.outputs.version }}
      STABLE: ${{ needs.meta.outputs.stable }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download the built packages
        uses: actions/download-artifact@v5
        with:
          name: vsix
          path: artifacts

      - name: Write the release notes
        run: |
          ls -l artifacts

          heading="## $VERSION - "
          awk -v heading="$heading" \
            'index($0, heading) == 1 { found = 1 }
             found && /^## / && index($0, heading) != 1 { exit }
             found' CHANGELOG.md > "$RUNNER_TEMP/notes.md"

          cat "$RUNNER_TEMP/notes.md"

      - name: Create the release
        if: env.DRY_RUN != 'true'
        run: |
          if [ "$STABLE" = "true" ]; then
            prerelease=false
          else
            prerelease=true
          fi

          gh release create "$TAG" artifacts/*.vsix \
            --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" \
            --prerelease="$prerelease" --latest="$STABLE"
